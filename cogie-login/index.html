<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogie | Welcome Back</title>
  <meta name="description" content="Sign in to your Cogie account" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="auth">
    <!-- LEFT PANEL: brand / visual -->
    <section class="auth__visual" aria-hidden="true">
      <div class="auth__blob" role="presentation"></div>

      <p class="auth__eyebrow">A wise quote</p>

      <div class="auth__hero">
        <h1 class="auth__hero-title">Get<br />Everything<br />You Want</h1>
        <p class="auth__hero-sub">
          You can get everything you want if you work hard,
          trust the process, and stick to the plan.
        </p>
      </div>
    </section>

    <!-- RIGHT PANEL: form -->
    <section class="auth__form-panel">
      <div class="auth__form-inner">

        <div class="brand">
          <span class="brand__mark">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M10 5.5c-1.9 0-3.4 1.5-3.4 3.4 0 1.9 1.5 4.6 3.4 5.6 1.9-1 3.4-3.7 3.4-5.6 0-1.9-1.5-3.4-3.4-3.4z" fill="currentColor"/>
            </svg>
          </span>
          <span class="brand__name">Cogie</span>
        </div>

        <div class="auth__copy">
          <h2 class="auth__title">Welcome Back</h2>
          <p class="auth__subtitle">Enter your email and password to access your account</p>
        </div>

        <form id="login-form" class="login-form" novalidate>

          <div class="field">
            <label for="email" class="field__label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="field__input"
              placeholder="Enter your email"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="email-error"
            />
            <p id="email-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="password" class="field__label">Password</label>
            <div class="field__input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                class="field__input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                aria-required="true"
                minlength="8"
                aria-describedby="password-error"
              />
              <button
                type="button"
                class="field__toggle"
                id="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M2 2l20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <p id="password-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="field field--row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <span class="checkbox__box" aria-hidden="true"></span>
              <span class="checkbox__label">Remember me</span>
            </label>
            <a href="#" class="link link--muted">Forgot Password</a>
          </div>

          <p id="form-status" class="form-status" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn btn--primary">
            <span class="btn__label">Sign In</span>
            <span class="btn__spinner" aria-hidden="true" hidden></span>
          </button>

          <button type="button" class="btn btn--google">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18Z" fill="#34A853"/>
              <path d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33Z" fill="#FBBC05"/>
              <path d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58Z" fill="#EA4335"/>
            </svg>
            <span>Sign In with Google</span>
          </button>
        </form>

        <p class="auth__footer">
          Don't have an account? <a href="#" class="link">Sign Up</a>
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
