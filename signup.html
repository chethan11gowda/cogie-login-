<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogie | Sign Up</title>
  <meta name="description" content="Create a new Cogie account" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-enter">

  <main class="auth auth--signup">
    <!-- LEFT PANEL: brand / visual -->
    <section class="auth__visual" aria-hidden="true">
      <div class="auth__blob" role="presentation"></div>

      <p class="auth__eyebrow">Join Us Today</p>

      <div class="auth__hero">
        <h1 class="auth__hero-title">Start<br />Your<br />Journey</h1>
        <p class="auth__hero-sub">
          Create an account to unlock all features and take your productivity to the next level.
        </p>
      </div>
    </section>

    <!-- RIGHT PANEL: form -->
    <section class="auth__form-panel">
      <div class="auth__form-inner fade-in-up">

        <div class="brand">
          <span class="brand__mark">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M10 5.5c-1.9 0-3.4 1.5-3.4 3.4 0 1.9 1.5 4.6 3.4 5.6 1.9-1 3.4-3.7 3.4-5.6 0-1.9-1.5-3.4-3.4-3.4z" fill="currentColor"/>
            </svg>
          </span>
          <span class="brand__name">Cogie</span>
        </div>

        <div class="auth__copy">
          <h2 class="auth__title">Create Account</h2>
          <p class="auth__subtitle">Enter your details to get started with Cogie</p>
        </div>

        <form id="signup-form" class="login-form" novalidate>

          <div class="field">
            <label for="fullname" class="field__label">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              class="field__input"
              placeholder="John Doe"
              autocomplete="name"
              required
              aria-required="true"
            />
            <p id="fullname-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="email" class="field__label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="field__input"
              placeholder="Enter your email"
              autocomplete="email"
              required
              aria-required="true"
            />
            <p id="email-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="password" class="field__label">Password</label>
            <div class="field__input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                class="field__input"
                placeholder="Create a password"
                autocomplete="new-password"
                required
                aria-required="true"
                minlength="8"
              />
            </div>
            <p id="password-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <p id="form-status" class="form-status" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn btn--primary btn--animate">
            <span class="btn__label">Sign Up</span>
            <span class="btn__spinner" aria-hidden="true" hidden></span>
          </button>
          
        </form>

        <p class="auth__footer">
          Already have an account? <a href="index.html" class="link">Sign In</a>
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
