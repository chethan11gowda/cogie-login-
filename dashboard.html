<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogie | Dashboard</title>
  <meta name="description" content="Your Cogie Dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body page-enter">

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brand__mark">
          <svg width="24" height="24" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6"/>
            <path d="M10 5.5c-1.9 0-3.4 1.5-3.4 3.4 0 1.9 1.5 4.6 3.4 5.6 1.9-1 3.4-3.7 3.4-5.6 0-1.9-1.5-3.4-3.4-3.4z" fill="currentColor"/>
          </svg>
        </span>
        <span class="sidebar__brand-name">Cogie</span>
      </div>
      
      <nav class="sidebar__nav">
        <a href="#" class="sidebar__link active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Overview
        </a>
        <a href="#" class="sidebar__link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
          Analytics
        </a>
        <a href="#" class="sidebar__link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Team
        </a>
        <a href="#" class="sidebar__link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </a>
      </nav>
      
      <div class="sidebar__footer">
        <a href="index.html" class="sidebar__link text-danger">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header fade-in-down">
        <div>
          <h1 class="dashboard-title">Welcome back, Alex!</h1>
          <p class="dashboard-subtitle">Here is what's happening with your projects today.</p>
        </div>
        <div class="user-profile">
          <img src="https://ui-avatars.com/api/?name=Alex+Doe&background=2f6fed&color=fff&rounded=true" alt="User Avatar" class="avatar" />
        </div>
      </header>

      <div class="dashboard-content stagger-fade-in">
        <!-- Metric Cards -->
        <div class="metrics-grid">
          <div class="metric-card glass-panel">
            <h3 class="metric-title">Total Revenue</h3>
            <p class="metric-value">$24,500</p>
            <span class="metric-trend positive">↑ 12% from last month</span>
          </div>
          <div class="metric-card glass-panel">
            <h3 class="metric-title">Active Users</h3>
            <p class="metric-value">1,430</p>
            <span class="metric-trend positive">↑ 4% from last month</span>
          </div>
          <div class="metric-card glass-panel">
            <h3 class="metric-title">Bounce Rate</h3>
            <p class="metric-value">22.4%</p>
            <span class="metric-trend negative">↓ 2% from last month</span>
          </div>
        </div>

        <!-- Main Chart Area -->
        <div class="chart-section glass-panel">
          <div class="chart-header">
            <h2>Performance Overview</h2>
            <button class="btn-outline">Export Report</button>
          </div>
          <div class="chart-placeholder">
            <!-- Simulated Chart Bar Heights -->
            <div class="bar" style="height: 40%"></div>
            <div class="bar" style="height: 60%"></div>
            <div class="bar" style="height: 35%"></div>
            <div class="bar" style="height: 80%"></div>
            <div class="bar" style="height: 55%"></div>
            <div class="bar" style="height: 90%"></div>
            <div class="bar" style="height: 70%"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
