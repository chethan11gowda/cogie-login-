<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogie | Forgot Password</title>
  <meta name="description" content="Recover your Cogie account password" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body class="page-enter">

  <main class="auth auth--single">
    <section class="auth__form-panel auth__form-panel--full">
      <div class="auth__form-inner fade-in-up">

        <div class="brand">
          <span class="brand__mark">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M10 5.5c-1.9 0-3.4 1.5-3.4 3.4 0 1.9 1.5 4.6 3.4 5.6 1.9-1 3.4-3.7 3.4-5.6 0-1.9-1.5-3.4-3.4-3.4z" fill="currentColor"/>
            </svg>
          </span>
          <span class="brand__name">Cogie</span>
        </div>

        <div class="auth__copy">
          <h2 class="auth__title">Reset Password</h2>
          <p class="auth__subtitle">Enter the email address associated with your account and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgot-form" class="login-form" novalidate>

          <div class="field">
            <label for="email" class="field__label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="field__input"
              placeholder="Enter your email"
              autocomplete="email"
              required
              aria-required="true"
            />
            <p id="email-error" class="field__error" role="alert" aria-live="polite"></p>
          </div>

          <p id="form-status" class="form-status" role="alert" aria-live="polite"></p>

          <button type="submit" class="btn btn--primary btn--animate">
            <span class="btn__label">Send Reset Link</span>
            <span class="btn__spinner" aria-hidden="true" hidden></span>
          </button>

        </form>

        <p class="auth__footer">
          Remember your password? <a href="index.html" class="link">Back to Sign In</a>
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
